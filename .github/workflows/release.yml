name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgles2-mesa-dev

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build Raspberry Pi 2 binaries
        run: zig build pi2

      - name: Build host SDL2 backend
        run: zig build -Doptimize=ReleaseFast

      - name: Build host framebuffer backend
        run: zig build -Doptimize=ReleaseFast -Dgui=fb

      - name: Build Windows 11 agent
        run: zig build win -Doptimize=ReleaseSafe

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          OUT="dist/release"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -f zig-out/bin/pimon-pi2-sdl "$OUT/"
          cp -f zig-out/bin/pimon-pi2-fb "$OUT/"
          cp -f zig-out/bin/pimon-sdl "$OUT/"
          cp -f zig-out/bin/pimon-fb "$OUT/"
          cp -f zig-out/bin/pimon-agent-win11.exe "$OUT/"
          ls -lh "$OUT"

      - name: Self-sign Windows agent (optional)
        env:
          SIGNING_PFX_BASE64: ${{ secrets.PIMON_CODESIGN_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.PIMON_CODESIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_PFX_BASE64}" ]; then
            echo "::notice::PIMON_CODESIGN_PFX_BASE64 not set - shipping an unsigned agent"
            exit 0
          fi
          sudo apt-get install -y osslsigncode
          mkdir -p dist/signing
          printf '%s' "$SIGNING_PFX_BASE64" | base64 -d > dist/signing/pimon-codesign.pfx
          osslsigncode sign \
            -pkcs12 dist/signing/pimon-codesign.pfx -pass "$SIGNING_PFX_PASSWORD" \
            -n "pimon Win11 agent" -i "https://github.com/liyu1981/pimon" \
            -h sha256 -ts http://timestamp.digicert.com \
            -in dist/release/pimon-agent-win11.exe \
            -out dist/release/pimon-agent-win11.signed.exe
          mv -f dist/release/pimon-agent-win11.signed.exe dist/release/pimon-agent-win11.exe
          osslsigncode verify -in dist/release/pimon-agent-win11.exe
          rm -rf dist/signing

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pimon-release
          path: dist/release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true
